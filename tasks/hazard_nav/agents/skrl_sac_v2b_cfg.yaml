# SAC v2: the -20 min_log_std copied from the PPO yaml is fatal for a squashed
# Gaussian -- sigma can collapse to e^-20, boundary-action log-probs explode,
# and the entropy term in SAC's target blows Q targets to 1e19 (measured:
# Q~2e6 vs Target~1e19 across all four v1 tuning variants, critic loss inf).
# b-variant: log_std floor + reward scale 0.01 + gamma 0.99, in case the
# reward magnitude is a second-order problem behind the entropy bomb.


models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -5.0
    max_log_std: 2.0
    initial_log_std: -1.9
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128, 64]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE


memory:
  class: RandomMemory
  memory_size: 32768


agent:
  class: SAC
  gradient_steps: 1
  batch_size: 4096
  discount_factor: 0.99
  rewards_shaper_scale: 0.01
  polyak: 0.005
  actor_learning_rate: 5.0e-04
  critic_learning_rate: 5.0e-04
  random_timesteps: 800
  learning_starts: 800
  grad_norm_clip: 1.0
  learn_entropy: True
  entropy_learning_rate: 5.0e-04
  initial_entropy_value: 1.0
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  experiment:
    directory: "usvbench"
    experiment_name: "sac_pathfinder"
    write_interval: auto
    checkpoint_interval: 256
    wandb: false


trainer:
  class: SequentialTrainer
  timesteps: 48000
  environment_info: log
