# SAC pathfinder for the baseline matrix (ICRA gap #1: algorithm breadth).
# Structure mirrors skrl's Runner SAC schema; the PPO yaml next door is the
# house style reference. Network sizes match PPO so capacity is not a factor
# in any PPO-vs-SAC comparison.
seed: 42


models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.9
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128, 64]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [128, 128, 64]
        activations: elu
    output: ONE


memory:
  class: RandomMemory
  memory_size: 32768


agent:
  class: SAC
  gradient_steps: 1
  batch_size: 4096
  discount_factor: 0.999
  polyak: 0.005
  actor_learning_rate: 5.0e-04
  critic_learning_rate: 5.0e-04
  random_timesteps: 800
  learning_starts: 800
  grad_norm_clip: 1.0
  learn_entropy: True
  entropy_learning_rate: 5.0e-04
  initial_entropy_value: 1.0
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  experiment:
    directory: "usvbench"
    experiment_name: "sac_pathfinder"
    write_interval: auto
    checkpoint_interval: 256
    wandb: false


trainer:
  class: SequentialTrainer
  timesteps: 48000
  environment_info: log
